name: fork-image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'pplulee/BeeCount-Cloud'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beecount_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:////tmp/beecount-ci.db
      DATA_DIR: /tmp/beecount-ci
      ALLOW_APP_RW_SCOPES: 'false'
      REGISTRATION_ENABLED: 'true'
      MCP_RECURRING_ENABLED: 'false'
      RAG_INDEX_REFRESH_INTERVAL_SECONDS: '0'
      BEECOUNT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/beecount_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backend regression tests including PostgreSQL writes
        run: python -m pytest tests -o addopts= -q --disable-warnings

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested source
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pplulee/beecount-cloud:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pplulee/BeeCount-Cloud
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.9.0-pplulee-${{ github.sha }}
          build-args: |
            VERSION=1.9.0-pplulee-${{ github.sha }}
          cache-from: type=gha,scope=pplulee-beecount
          cache-to: type=gha,mode=max,scope=pplulee-beecount
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/pplulee/beecount-cloud@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
